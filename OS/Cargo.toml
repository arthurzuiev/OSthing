[package]
name = "OS"
version = "0.1.0"
edition = "2024"

[dependencies]
bootloader = "0.9"
volatile = "0.2.6"
spin = "0.5.2"

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

# to make rust-analyzer happy :D
[[bin]]
name = "OS"
test = false
bench = false

# panic is not an option in BIOS wastelands...
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
